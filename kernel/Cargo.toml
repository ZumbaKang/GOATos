[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
uart_16550 = "0.6"
spin = "0.9"

# Debug-only switches that make the kernel raise one CPU exception on purpose,
# right after the handlers for it are installed, so those handlers can be
# verified against the real thing (see `exceptions::trigger_debug_exception`).
# Enable exactly one, and only for a test boot:
#   make disk KERNEL_FEATURES=trigger-divide-error
[features]
trigger-divide-error = []
trigger-invalid-opcode = []
trigger-general-protection-fault = []
# Provokes a real double fault (by taking away the divide-error handler and
# then dividing by zero), which the CPU delivers through the vector-8 task gate
# onto its own stack.
trigger-double-fault = []
# Takes vector 8 directly (`int $8`) instead of provoking a real escalation:
# proves the task gate and private stack under emulators that don't implement
# turning a failed exception delivery into a double fault (v86).
trigger-double-fault-gate = []
# Takes a vector nothing has registered (0x60), which the catch-all handler
# should report and then *resume* from - unlike an exception, a stray interrupt
# is not fatal (see `interrupts::trigger_debug_interrupt`).
trigger-unhandled-interrupt = []
# Takes vector 39, the line an 8259 raises when it has an interrupt it cannot
# attribute to any IRQ: the handler must recognise it from the in-service
# register and *not* acknowledge it.
trigger-spurious-irq = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
