[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "goatos"
version = "0.1.0"
edition = "2021"
description = "Runner that builds a bootable disk image for the GOATos kernel and boots it in QEMU."
publish = false

[build-dependencies]
bootloader = "0.11"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
