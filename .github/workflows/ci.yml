name: CI

on:
  pull_request:
    branches: [main]
    # The default types plus `ready_for_review`, so that marking a PR ready
    # (by hand, or by the `ready-for-review` job below) runs the checks and
    # reaches the auto-merge gate instead of leaving it tested-but-stranded.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust toolchain
        run: |
          rustup toolchain install nightly --component rust-src --component llvm-tools-preview --component clippy
          rustup default nightly

      - name: Install build dependencies (nasm, binutils, qemu)
        run: sudo apt-get update && sudo apt-get install -y nasm binutils qemu-system-x86

      - name: cargo clippy
        working-directory: kernel
        run: cargo clippy -- -D warnings

      - name: Build + boot test
        run: make test

  # Takes `cursor/*` PRs out of draft. The Cursor Automation that opens them
  # can only create drafts, and the auto-merge job below refuses to merge a
  # draft, so without this every automated PR sits tested-but-unmerged until
  # a human clicks "Ready for review". Deliberately scoped to `cursor/*`
  # branches in this repository: draft status still means "not ready" for
  # human PRs and for anything from a fork.
  ready-for-review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark the pull request ready for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isDraft --jq .isDraft)" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$REPO"
          else
            echo "Already ready for review; nothing to do."
          fi

  # Merges the PR automatically once `test` passes, but only for PRs on
  # branches following this project's `cursor/*` convention (i.e. opened by an
  # automation/agent following .cursor/skills/roadmap-automation) that live in
  # this repository. Human PRs on other branch names, and anything from a
  # fork, are left for manual review/merge.
  auto-merge:
    needs: [test, ready-for-review]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Draft status is still an absolute "do not merge", but it has to be
      # re-read here rather than taken from the event payload: that payload
      # predates the `ready-for-review` job. A PR that is somehow still a
      # draft at this point (e.g. that job failed) is left alone.
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "Pull request is still a draft; leaving it for manual review." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
