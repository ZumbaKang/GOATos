name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust toolchain
        run: |
          rustup toolchain install nightly --component rust-src --component llvm-tools-preview --component clippy
          rustup default nightly

      - name: Install build dependencies (nasm, binutils, qemu)
        run: sudo apt-get update && sudo apt-get install -y nasm binutils qemu-system-x86

      - name: cargo clippy
        working-directory: kernel
        run: cargo clippy -- -D warnings

      - name: Build + boot test
        run: make test

  # Merges the PR automatically once `test` passes, but only for
  # non-draft PRs on branches following this project's `cursor/*`
  # convention (i.e. opened by an automation/agent following
  # .cursor/skills/roadmap-automation). Human PRs on other branch names,
  # and *any* PR deliberately left as a draft, are left for manual
  # review/merge - draft status is treated as an explicit "not ready"
  # signal that this workflow must never override.
  auto-merge:
    needs: test
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
